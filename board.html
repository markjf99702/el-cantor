<!DOCTYPE html>
<html lang="en" class="notranslate" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lotería">
<meta name="theme-color" content="#F3E7CF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1D1714" media="(prefers-color-scheme: dark)">
<title>Lotería · Play along</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bree+Serif&family=Nunito+Sans:ital,opsz,wght@0,6..12,400;0,6..12,600;0,6..12,700;1,6..12,400&display=swap">
<style>
:root{
  --bg:#F3E7CF;--paper:#FBF4E4;--paper2:#EFE1C5;--ink:#2B221C;--ink2:#6A5A4C;--ink3:#9A8A78;--line:#DCCBA9;--line2:#C4AE84;
  --red:#B7332F;--red-ink:#FFF7EA;--red-soft:#F3D3CB;--teal:#1F6F6D;--teal-soft:#CFE4E0;--gold:#D99A2B;--gold-soft:#F6E3B4;--green:#3E7D4A;
  --disp:"Bree Serif",Georgia,serif;--body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --shadow:0 1px 0 rgba(43,34,28,.05),0 10px 24px -14px rgba(43,34,28,.35);
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1D1714;--paper:#27201B;--paper2:#322922;--ink:#F3E9DA;--ink2:#C9B9A4;--ink3:#8D7E6C;--line:#3F332B;--line2:#5A4B3F;
  --red:#E2554F;--red-ink:#1D1714;--red-soft:#4A2521;--teal:#5FB3AE;--teal-soft:#1D3835;--gold:#E8B24A;--gold-soft:#4A3712;--green:#6DBB7C;
  --shadow:0 1px 0 rgba(0,0,0,.4),0 12px 28px -14px rgba(0,0,0,.85);
}}
:root[data-theme="dark"]{
  --bg:#1D1714;--paper:#27201B;--paper2:#322922;--ink:#F3E9DA;--ink2:#C9B9A4;--ink3:#8D7E6C;--line:#3F332B;--line2:#5A4B3F;
  --red:#E2554F;--red-ink:#1D1714;--red-soft:#4A2521;--teal:#5FB3AE;--teal-soft:#1D3835;--gold:#E8B24A;--gold-soft:#4A3712;--green:#6DBB7C;
  --shadow:0 1px 0 rgba(0,0,0,.4),0 12px 28px -14px rgba(0,0,0,.85);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.4 var(--body);-webkit-font-smoothing:antialiased;overflow:hidden;position:fixed;inset:0;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
input{background:var(--paper);border:1px solid var(--line2);border-radius:10px;padding:9px 12px;min-width:0;font-size:16px}
input:focus-visible,button:focus-visible{outline:2px solid var(--teal);outline-offset:1px}
.app{position:absolute;inset:0;display:flex;flex-direction:column;padding-top:var(--sat);padding-bottom:var(--sab)}
/* header */
.top{display:flex;align-items:center;gap:6px;padding:8px 10px 6px;flex:none}
.top h1{margin:0;font:400 20px/1 var(--disp);letter-spacing:.01em;color:var(--red);flex:1;display:flex;align-items:baseline;gap:8px;min-width:0}
.top h1 small{font:600 11px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{background:var(--paper);border:1px solid var(--line2);border-radius:999px;padding:6px 11px;font:600 12.5px var(--body);color:var(--ink2);white-space:nowrap;display:inline-flex;align-items:center;gap:5px;text-decoration:none}
.chip.home svg{width:17px;height:17px;display:block}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.red{background:var(--red);color:var(--red-ink);border-color:var(--red)}
.chip.teal{background:var(--teal);color:#fff;border-color:var(--teal)}
.chip.ic{width:34px;height:34px;padding:0;justify-content:center;font-size:16px}
/* called bar */
.called{display:flex;gap:10px;align-items:stretch;padding:0 10px 8px;flex:none}
.callbtn{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:104px;background:var(--red);color:var(--red-ink);border:0;border-radius:14px;padding:8px 12px;box-shadow:var(--shadow)}
.callbtn b{font:400 19px/1.05 var(--disp)}
.callbtn span{font:600 10.5px var(--body);letter-spacing:.1em;text-transform:uppercase;opacity:.8}
.last{flex:1;display:flex;gap:10px;align-items:center;min-width:0;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:6px 8px;box-shadow:var(--shadow)}
.last img{width:36px;aspect-ratio:2/3.26;object-fit:cover;border-radius:4px;background:#fff;flex:none}
.last .t{min-width:0;flex:1}
.last .n{font:400 17px/1.15 var(--disp);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.last .n small{font:600 11px var(--body);color:var(--ink3);margin-right:6px}
.last .v{font-size:12px;color:var(--ink2);font-style:italic;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.last .empty{font-size:13px;color:var(--ink3)}
.last button.undo{flex:none;background:none;border:1px solid var(--line2);border-radius:999px;width:34px;height:34px;color:var(--ink2);font-size:15px}
/* boards */
.stage{flex:1;min-height:0;position:relative;padding:2px 10px 6px}
.boards{position:absolute;inset:2px 10px 6px;display:grid;justify-content:center;align-content:center;gap:var(--gap,10px)}
.tabla{width:var(--bw);display:flex;flex-direction:column;gap:3px;min-width:0}
.tabla .lbl{display:flex;justify-content:space-between;align-items:center;font:600 11px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);padding:0 2px;height:16px}
.tabla .lbl button{background:none;border:0;padding:0;color:inherit;font:inherit;letter-spacing:inherit;text-transform:inherit;display:flex;align-items:center;gap:4px}
.tabla .lbl .k{font-weight:700;color:var(--ink2)}
.tabla.win .lbl .k{color:var(--green)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:2px;background:var(--line2);border:2px solid var(--line2);border-radius:8px;overflow:hidden;aspect-ratio:2/3.26;box-shadow:var(--shadow);position:relative}
.tabla.win .grid{border-color:var(--green);box-shadow:0 0 0 3px color-mix(in srgb,var(--green) 40%,transparent),var(--shadow)}
.cell{position:relative;background:#fff;overflow:hidden;cursor:pointer}
.cell img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.cell.dim::before{content:"";position:absolute;inset:0;background:rgba(20,12,8,.62);z-index:2}
.cell.hit{outline:3px solid var(--gold);outline-offset:-3px;z-index:3}
.cell.marked img{filter:brightness(.55) saturate(.7)}
.cell .mk{position:absolute;left:50%;top:50%;z-index:4;pointer-events:none;width:78%;aspect-ratio:1;transform:translate(-50%,-50%) rotate(var(--rot,0deg)) scale(1);filter:drop-shadow(0 2px 4px rgba(0,0,0,.6))}
.cell .mk svg{width:100%;height:100%;display:block}
@keyframes drop{0%{transform:translate(-50%,-70%) rotate(var(--rot,0deg)) scale(1.5);opacity:0}70%{transform:translate(-50%,-50%) rotate(var(--rot,0deg)) scale(.94);opacity:1}100%{transform:translate(-50%,-50%) rotate(var(--rot,0deg)) scale(1)}}
.cell .mk.new{animation:drop .32s cubic-bezier(.2,.8,.3,1.1)}
@keyframes pulse{0%,100%{box-shadow:inset 0 0 0 3px var(--gold)}50%{box-shadow:inset 0 0 0 6px var(--gold)}}
.cell.hit::after{content:"";position:absolute;inset:0;z-index:5;animation:pulse 1.2s ease-in-out infinite}
/* history */
.hist{flex:none;display:flex;gap:6px;overflow-x:auto;padding:4px 10px 8px;scrollbar-width:none;min-height:38px;align-items:center}
.hist::-webkit-scrollbar{display:none}
.hist .h{flex:none;display:flex;align-items:center;gap:5px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:3px 9px 3px 4px;font:600 12px var(--body);color:var(--ink2)}
.hist .h img{width:16px;aspect-ratio:2/3.26;object-fit:cover;border-radius:2px}
.hist .h.miss{border-color:var(--line2);color:var(--ink3);opacity:.7}
.hist .cnt{flex:none;font:600 11px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);padding-right:4px}
/* sheets */
.sheetbg{position:fixed;inset:0;background:rgba(30,20,14,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:min(760px,100%);max-height:calc(100% - 20px - var(--sat));display:flex;flex-direction:column;border-radius:18px 18px 0 0;border-top:3px solid var(--red);padding-bottom:var(--sab)}
.sheet .hd{display:flex;gap:8px;align-items:center;padding:12px 14px 8px;flex:none}
.sheet .hd h2{margin:0;font:400 20px/1 var(--disp);flex:1}
.sheet .hd input{flex:1}
.sheet .bd{overflow:auto;padding:4px 14px 16px;flex:1;min-height:0;-webkit-overflow-scrolling:touch}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.pk{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:5px 5px 6px;text-align:center;cursor:pointer;position:relative}
.pk img{width:100%;aspect-ratio:2/3.26;object-fit:cover;border-radius:5px;display:block;background:#fff}
.pk .n{font:400 12.5px/1.15 var(--disp);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk .num{position:absolute;top:8px;left:8px;background:var(--ink);color:var(--bg);font:700 10px var(--body);border-radius:999px;padding:1px 6px}
.pk.called{opacity:.45}
.pk.called::after{content:"✓";position:absolute;top:6px;right:8px;background:var(--green);color:#fff;border-radius:999px;width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.pk.used{outline:2px solid var(--teal)}
.pk.taken{opacity:.35}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{background:var(--ink);color:var(--bg);border:1px solid var(--ink);border-radius:10px;padding:9px 14px;font:700 14px var(--body)}
.btn.sec{background:var(--paper);color:var(--ink);border-color:var(--line2)}
.btn.red{background:var(--red);border-color:var(--red);color:var(--red-ink)}
.btn.sm{padding:6px 10px;font-size:13px}
a.btn{text-decoration:none;display:inline-block}
.note{color:var(--ink2);font-size:13.5px}
a{color:var(--teal);font-weight:700}
.eyebrow{font:600 11px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:12px}
/* patterns */
.pats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.pat{display:flex;gap:10px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:8px 10px;cursor:pointer;text-align:left}
.pat.on{border-color:var(--teal);background:var(--teal-soft)}
.pat .mini{display:grid;grid-template-columns:repeat(4,1fr);gap:1.5px;width:32px;flex:none}
.pat .mini i{display:block;aspect-ratio:1;background:var(--line);border-radius:1px}
.pat .mini i.f{background:var(--teal)}
.pat .mini i.q{background:var(--gold)}
.pat b{display:block;font:400 15px var(--disp)}
.pat small{display:block;font-size:11.5px;color:var(--ink2)}
/* editor */
.edb{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.edb .eg{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;background:var(--line2);border:2px solid var(--line2);border-radius:8px;overflow:hidden;aspect-ratio:2/3.26}

.edb .eg .cell.sel{outline:3px solid var(--teal);outline-offset:-3px}
.edb input{width:100%;margin-bottom:6px;font-size:15px;padding:7px 10px}
.edb .warn{color:var(--red);font-size:12.5px;margin-top:6px;font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:999px;overflow:hidden;background:var(--paper)}
.seg button{background:none;border:0;padding:6px 12px;font:600 13px var(--body);color:var(--ink2)}
.seg button.on{background:var(--ink);color:var(--bg)}
/* win overlay */
.winbg{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:rgba(30,20,14,.55);padding:20px}
.winc{background:var(--paper);border:3px solid var(--gold);border-radius:22px;padding:26px 28px 22px;text-align:center;max-width:420px;width:100%;box-shadow:0 30px 60px -20px rgba(0,0,0,.6);animation:pop .35s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.winc h2{margin:0;font:400 46px/1 var(--disp);color:var(--red);letter-spacing:.01em}
.winc p{margin:10px 0 0;color:var(--ink2);font-size:15px}
.winc .row{justify-content:center;margin-top:18px}
.toast{position:fixed;left:50%;bottom:calc(20px + var(--sab));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;font:600 13px var(--body);opacity:0;transition:.2s;pointer-events:none;z-index:80;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
@media (max-width:520px){.top h1 small{display:none}.callbtn{min-width:88px;padding:6px 10px}.callbtn b{font-size:17px}.last .v{display:none}}
@media (prefers-reduced-motion:reduce){.cell .mk.new,.winc,.cell.hit::after{animation:none}.toast{transition:none}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <a class="chip ic home" href="./" aria-label="Home — all the Lotería tools" title="Home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11.5 12 5l8 6.5"/><path d="M6.5 10v9h11v-9"/></svg></a>
    <h1>Lotería <small id="who"></small></h1>
    <button class="chip" id="patBtn" type="button">Línea</button>
    <button class="chip" id="tablasBtn" type="button">Tablas</button>
    <button class="chip ic" id="clearBtn" type="button" aria-label="New round" title="New round">↺</button>
    <button class="chip ic" id="setBtn" type="button" aria-label="Settings" title="Settings">⋯</button>
  </div>
  <div class="called">
    <button class="callbtn" id="callBtn" type="button"><b>Cantaron…</b><span>they called</span></button>
    <div class="last" id="last"></div>
  </div>
  <div class="stage"><div class="boards" id="boards"></div></div>
  <div class="hist" id="hist"></div>
</div>
<div id="sheet" hidden></div>
<div id="winbox" hidden></div>
<div class="toast" id="toast" role="status"></div>
<script src="deck.js" data-cards="cards/"></script>
<script>(function () {

  function fresh() { var p = { id: uid(), name: 'Mark', boards: origBoards() }; return { players: [p], current: p.id, patterns: ['linea', 'esquinas', 'cuadro'], settings: { marker: 'bean', sound: true, guide: true } }; }
  var S = fresh(), G = { called: [], announced: {} }, UI = { focus: null, sheet: null, edit: null };
  var firstRun = true;
  try { var raw = localStorage.getItem(LS); if (raw) { var o = JSON.parse(raw); if (o && o.players && o.players.length) { S = Object.assign(fresh(), o); firstRun = false; } } } catch (e) { }
  try { var rg = localStorage.getItem(LSG); if (rg) { var g = JSON.parse(rg); if (g && g.called) G = Object.assign({ called: [], announced: {} }, g); } } catch (e) { }
  function save() { try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) { } }
  function saveG() { try { localStorage.setItem(LSG, JSON.stringify(G)); } catch (e) { } }
  function player() { var p = S.players.filter(function (p) { return p.id === S.current; })[0]; if (!p) { p = S.players[0]; S.current = p.id; } return p; }
  function isCalled(n) { return G.called.indexOf(n) >= 0; }

  function tick() { var a = ac(); if (!a) return; var t = a.currentTime, o = a.createOscillator(), g = a.createGain(); o.type = 'triangle'; o.frequency.setValueAtTime(520, t); o.frequency.exponentialRampToValueAtTime(180, t + 0.08); g.gain.setValueAtTime(0.18, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.12); o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + 0.13); }
  function fanfare() { var a = ac(); if (!a) return; var t = a.currentTime; [523, 659, 784, 1047, 784, 1047].forEach(function (f, i) { var o = a.createOscillator(), g = a.createGain(); o.type = 'square'; o.frequency.value = f; var s = t + i * 0.11; g.gain.setValueAtTime(0.0001, s); g.gain.exponentialRampToValueAtTime(0.12, s + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, s + (i === 5 ? 0.5 : 0.12)); o.connect(g); g.connect(a.destination); o.start(s); o.stop(s + 0.55); }); }

  // ---------- marker ----------
  var BEAN = '<svg viewBox="0 0 100 100"><defs><radialGradient id="mkb" cx="38%" cy="32%" r="72%"><stop offset="0" stop-color="#D2AB7F"/><stop offset=".55" stop-color="#8E5C38"/><stop offset="1" stop-color="#48290F"/></radialGradient></defs><path d="M20 60C10 36 28 16 52 16c25 0 36 17 31 36-4 14-15 23-31 26C36 81 26 74 20 60z" fill="url(#mkb)" stroke="#FFF4DC" stroke-width="5" paint-order="stroke"/><path d="M40 28c6-5 16-5 24-1" stroke="#4A2A12" stroke-width="3.5" fill="none" opacity=".55" stroke-linecap="round"/><ellipse cx="62" cy="52" rx="7" ry="5" fill="#4A2A12" opacity=".35"/><ellipse cx="38" cy="62" rx="5" ry="3.5" fill="#4A2A12" opacity=".3"/><ellipse cx="50" cy="40" rx="3" ry="2" fill="#4A2A12" opacity=".25"/></svg>';
  var CHIP = '<svg viewBox="0 0 100 100"><defs><radialGradient id="mkc" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#FF7A6E"/><stop offset=".7" stop-color="#C62A22"/><stop offset="1" stop-color="#7E140F"/></radialGradient></defs><circle cx="50" cy="50" r="42" fill="url(#mkc)" stroke="#FFF4DC" stroke-width="5"/><circle cx="50" cy="50" r="30" fill="none" stroke="#fff" stroke-opacity=".25" stroke-width="3"/></svg>';
  var COIN = '<svg viewBox="0 0 100 100"><defs><radialGradient id="mkg" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#FFE9A6"/><stop offset=".6" stop-color="#D9A32B"/><stop offset="1" stop-color="#8A5E0E"/></radialGradient></defs><circle cx="50" cy="50" r="42" fill="url(#mkg)" stroke="#FFF4DC" stroke-width="5"/><circle cx="50" cy="50" r="33" fill="none" stroke="#8A5E0E" stroke-opacity=".5" stroke-width="2.5"/><text x="50" y="58" text-anchor="middle" font-family="Georgia,serif" font-size="26" fill="#8A5E0E" opacity=".7">$</text></svg>';
  function markerSvg() { return S.settings.marker === 'chip' ? CHIP : S.settings.marker === 'coin' ? COIN : BEAN; }
  function rotFor(b, c) { return ((b * 37 + c * 53) % 70) - 35; }

  // ---------- wins ----------
  function checkBoard(bd) { return L.check(bd.cards, isCalled, S.patterns); }
  function guideCells() {
    var fixed = S.patterns.map(pat).filter(function (p) { return p && !p.min && p.sets.length === 1 && p.id !== 'llena'; });
    if (!fixed.length || fixed.length !== S.patterns.length) return null;
    var u = {}; fixed.forEach(function (p) { p.sets[0].forEach(function (c) { u[c] = 1; }); }); return u;
  }
  function evaluate(announce) {
    var p = player(), newWins = [];

  function layout() {
    var host = $('boards'), n = host.children.length; if (!n) return;

  function decodeShare(h) {
    var m = /#t=(.+)$/.exec(h); if (!m) return null;
    var parts = m[1].split('~'); if (parts.length < 2) return null;
    var boards = parts.slice(1).map(function (s) { var i = s.indexOf(':'); var cards = s.slice(i + 1).split('.').map(function (x) { return parseInt(x, 36); }); if (cards.length !== 16 || cards.some(function (n) { return !(n >= 1 && n <= 54); })) return null; return { id: uid(), name: decodeURIComponent(s.slice(0, i)) || 'Tabla', cards: cards }; });
    if (boards.some(function (b) { return !b; })) return null;
    return { name: decodeURIComponent(parts[0]) || 'Guest', boards: boards };
  }

    var nb = $('shNative'); if (nb) nb.addEventListener('click', function () { navigator.share({ title: 'Lotería tablas', text: p.name + '’s tablas', url: url }).catch(function () { }); });

  // ---------- first visit ----------
  function welcomeSheet() {
    var sh = openSheet('<div class="hd"><h2>Who’s playing on this device?</h2></div><div class="bd stack"><p class="note">Asked once. Tablas are saved on this phone or tablet only, so what you set up here is yours and nobody else’s.</p><input id="wName" placeholder="Your name" autocomplete="off"><div class="card"><div class="eyebrow">Start with</div><div class="row" style="margin-top:8px"><button class="btn red" type="button" id="wRandom">Random tablas I’ll edit</button><button class="btn sec" type="button" id="wMark">Mark’s four tablas</button></div><p class="note" style="margin-top:8px">Either way you can change every square later under <b>Tablas</b>.</p></div></div>');
    sh.parentElement.replaceWith(sh.parentElement.cloneNode(true)); // drop the tap-outside-to-close handler
    function go(mark) {
      var name = $('wName').value.trim() || (mark ? 'Mark' : 'Player');
      var p = { id: uid(), name: name, boards: mark ? origBoards() : [randomBoard('Tabla 1'), randomBoard('Tabla 2')] };
      S.players = [p]; S.current = p.id; save(); closeSheet(); render();
      toast(mark ? 'Playing as ' + name : name + ', tap Tablas to set up your cards');
    }
    $('wRandom').addEventListener('click', function () { go(false); });
    $('wMark').addEventListener('click', function () { go(true); });
    $('wName').addEventListener('keydown', function (e) { if (e.key === 'Enter') go(false); });
  }

  // ---------- wiring ----------
  $('callBtn').addEventListener('click', function () { pickerSheet('call', function (n) { call(n); }); });
  $('patBtn').addEventListener('click', function () { patternSheet(); });
  $('tablasBtn').addEventListener('click', tablasSheet);
  $('setBtn').addEventListener('click', settingsSheet);
  $('clearBtn').addEventListener('click', function () { // always starts a new round, even with nothing called yet
    if (G.called.length < 3) { clearRound(); return; }
    openSheet('<div class="hd"><h2>Clear the round?</h2></div><div class="bd stack"><p class="note">Takes the beans off all ' + G.called.length + ' called cards so you can start the next round.</p><div class="row"><button class="btn red" type="button" id="clOk">Clear for a new round</button><button class="btn sec" type="button" id="clNo">Keep playing</button></div></div>');
    $('clOk').addEventListener('click', function () { closeSheet(); clearRound(); });
    $('clNo').addEventListener('click', closeSheet);
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { closeSheet(); $('winbox').hidden = true; } });
  window.addEventListener('resize', layout);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', layout);
  render();
  if (firstRun && !decodeShare(location.hash)) welcomeSheet(); else { save(); maybeImport(); }
  window.addEventListener('hashchange', maybeImport);
})();
</script>
</body>
</html>
