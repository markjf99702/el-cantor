<!DOCTYPE html>
<html lang="en" class="notranslate" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="carry.js"></script>
<script src="strings.js"></script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="El Cantor">
<meta name="theme-color" content="#F3E7CF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1D1714" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<title>El Cantor</title>
<meta name="description" content="El Cantor shuffles the lotería deck and calls each card aloud in Spanish, and checks a ¡Lotería! when someone calls it.">
<meta property="og:title" content="El Cantor">
<meta property="og:description" content="Baraja y canta cada carta en voz alta, desde el teléfono o la tableta en la cabecera de la mesa. In English too.">
<meta property="og:image" content="https://el-cantor.junkdrawer.works/og.png">
<meta property="og:url" content="https://el-cantor.junkdrawer.works/cantor.html">
<meta name="twitter:card" content="summary_large_image">
<link rel="preload" href="fonts/bree-serif-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/nunito-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{
  --bg:#F3E7CF;--paper:#FBF4E4;--paper2:#EFE1C5;--ink:#2B221C;--ink2:#6A5A4C;--ink3:#746453;--line:#DCCBA9;--line2:#C4AE84;
  --red:#B7332F;--red-ink:#FFF7EA;--red-soft:#F3D3CB;--teal:#1F6F6D;--teal-soft:#CFE4E0;--on-teal:#fff;--gold:#D99A2B;--gold-soft:#F6E3B4;--green:#3E7D4A;--green-soft:#D7E8D3;
  --fa:#B7332F;--fb:#1F6F6D;--fc:#D99A2B;--fd:#3E7D4A;--fe:#C2477A;--dim:.3;
  --disp:"Bree Serif",Georgia,serif;--body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --shadow:0 1px 0 rgba(43,34,28,.05),0 10px 24px -14px rgba(43,34,28,.35);
  --lift:0 2px 0 rgba(43,34,28,.08),0 28px 44px -20px rgba(43,34,28,.6);
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#1D1714;--paper:#27201B;--paper2:#231C18;--ink:#F3E9DA;--ink2:#C9B9A4;--ink3:#8D7E6C;--line:#3F332B;--line2:#5A4B3F;
  --red:#E2554F;--red-ink:#1D1714;--red-soft:#4A2521;--teal:#5FB3AE;--teal-soft:#1D3835;--on-teal:#1D1714;--gold:#E8B24A;--gold-soft:#4A3712;--green:#6DBB7C;--green-soft:#1F3A25;
  --fa:#C94A44;--fb:#3E9591;--fc:#D9A640;--fd:#5B9D67;--fe:#C95F8C;--dim:.24;
  --shadow:0 1px 0 rgba(0,0,0,.4),0 12px 28px -14px rgba(0,0,0,.85);
  --lift:0 2px 0 rgba(0,0,0,.5),0 30px 50px -18px rgba(0,0,0,.95);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#1D1714;--paper:#27201B;--paper2:#231C18;--ink:#F3E9DA;--ink2:#C9B9A4;--ink3:#8D7E6C;--line:#3F332B;--line2:#5A4B3F;
  --red:#E2554F;--red-ink:#1D1714;--red-soft:#4A2521;--teal:#5FB3AE;--teal-soft:#1D3835;--on-teal:#1D1714;--gold:#E8B24A;--gold-soft:#4A3712;--green:#6DBB7C;--green-soft:#1F3A25;
  --fa:#C94A44;--fb:#3E9591;--fc:#D9A640;--fd:#5B9D67;--fe:#C95F8C;--dim:.24;
  --shadow:0 1px 0 rgba(0,0,0,.4),0 12px 28px -14px rgba(0,0,0,.85);
  --lift:0 2px 0 rgba(0,0,0,.5),0 30px 50px -18px rgba(0,0,0,.95);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.4 var(--body);-webkit-font-smoothing:antialiased;overflow:hidden;position:fixed;inset:0;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.45}
input,select{background:var(--paper);border:1px solid var(--line2);border-radius:10px;padding:9px 12px;min-width:0;font-size:16px}
input[type=range]{padding:0;border:0;background:none;accent-color:var(--teal);width:100%}
input[type=search]{-webkit-appearance:none;appearance:none}
input[type=search]::-webkit-search-cancel-button{display:none} /* the box clears itself when a card is picked */
input:focus-visible,button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
a{color:var(--teal);font-weight:700}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.app{position:absolute;inset:0;display:flex;flex-direction:column;padding-top:var(--sat);padding-bottom:var(--sab)}
/* papel picado */
.picado{flex:none;height:34px;overflow:hidden;pointer-events:none}
.picado svg{display:block}
.picado .str{fill:none;stroke:var(--ink3);stroke-width:1;opacity:.7}
.picado .fl{transform-box:fill-box;transform-origin:50% 0;animation:sway 4.5s ease-in-out infinite alternate;opacity:.94}
.fa{fill:var(--fa)}.fb{fill:var(--fb)}.fc{fill:var(--fc)}.fd{fill:var(--fd)}.fe{fill:var(--fe)}
@keyframes sway{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
/* header */
.top{display:flex;align-items:center;gap:6px;padding:0 16px 6px;flex:none}
.top h1{margin:0;font:400 23px/1 var(--disp);letter-spacing:.01em;color:var(--red);flex:1;display:flex;align-items:baseline;gap:10px;min-width:0;white-space:nowrap}
.top h1 small{font:700 11px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{background:var(--paper);border:1px solid var(--line2);border-radius:999px;padding:6px 11px;font:700 12.5px var(--body);color:var(--ink2);white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.teal{background:var(--teal);color:var(--on-teal);border-color:var(--teal)}
.chip.ic{width:34px;height:34px;padding:0;justify-content:center;font-size:16px}
.chip svg{width:15px;height:15px;flex:none}
a.chip{text-decoration:none}
.chip.home svg{width:17px;height:17px}
/* stage */
.stage{flex:1;min-height:0;display:flex;gap:22px;padding:2px 16px 10px}
.app.tall .stage{flex-direction:column;gap:12px}
.deal{flex:1 1 0;min-width:0;min-height:0;display:flex;flex-direction:column;align-items:center;gap:10px}
.cardarea{flex:1 1 0;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
.flip{position:relative;flex:none;width:var(--cw,220px);height:var(--ch,360px);perspective:1600px;border:0;padding:0;background:none;border-radius:calc(var(--cw,220px)*.04)}
.flip .inner{position:absolute;inset:0;transform-style:preserve-3d}
.flip .inner.down{transform:rotateY(180deg)}
.flip .inner.turn{animation:turn .64s cubic-bezier(.25,.8,.25,1)}
@keyframes turn{0%{transform:translateY(-14px) rotateY(180deg) rotateZ(-4deg)}100%{transform:none}}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:calc(var(--cw,220px)*.04);overflow:hidden;box-shadow:var(--lift);background:#FBF4E4} /* the card's own paper, in both themes */
.face.front img{width:100%;height:100%;object-fit:cover;display:block}
.face.back{transform:rotateY(180deg)}
.back .pat{position:absolute;inset:calc(var(--cw,220px)*.035);border-radius:calc(var(--cw,220px)*.025);background:repeating-linear-gradient(45deg,rgba(255,226,160,.17) 0 1.5px,transparent 1.5px 13px),repeating-linear-gradient(-45deg,rgba(255,226,160,.17) 0 1.5px,transparent 1.5px 13px),#A92B27;box-shadow:inset 0 0 0 calc(var(--cw,220px)*.03) #A92B27,inset 0 0 0 calc(var(--cw,220px)*.04) #E2B04A}
.back .seal{position:absolute;left:50%;top:50%;width:66%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:#FFF3D6;box-shadow:0 0 0 calc(var(--cw,220px)*.012) #E2B04A,0 0 0 calc(var(--cw,220px)*.03) #A92B27,0 0 0 calc(var(--cw,220px)*.037) #E2B04A;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#A92B27;text-align:center}
.back .seal b{font:400 calc(var(--cw,220px)*.13)/1 var(--disp)}
.back .seal span{font:800 calc(var(--cw,220px)*.036)/1 var(--body);letter-spacing:.22em;text-transform:uppercase;margin-top:calc(var(--cw,220px)*.035);color:#7C1E1B}
.tiebar{flex:none;max-width:100%;background:var(--gold-soft);border:1px solid var(--gold);color:var(--ink);border-radius:999px;padding:5px 14px;font:800 13px/1.3 var(--body);text-align:center;text-wrap:balance}
.cap{flex:none;text-align:center;max-width:34em;padding:0 8px;min-height:84px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start}
.cap .no{font:800 11px var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-variant-numeric:tabular-nums}
.cap h2{margin:3px 0 4px;font:400 clamp(28px,4.4vw,48px)/1.04 var(--disp);text-wrap:balance}
.cap p{margin:0;font-style:italic;color:var(--ink2);font-size:clamp(14.5px,1.8vw,19px);line-height:1.35;text-wrap:balance}
.cap .btn{margin-top:12px}
.cap .again{background:none;border:0;padding:0 4px;margin:0;font:inherit;color:inherit;text-wrap:balance;border-radius:8px} /* the card's name: a tap says it again */
@media (hover:hover){.cap .again:hover{text-decoration:underline;text-decoration-color:var(--line2);text-decoration-thickness:2px;text-underline-offset:5px}}
.antes{flex:none;display:flex;gap:6px;align-items:center;justify-content:center;height:34px;overflow:hidden;max-width:100%;flex-wrap:wrap}
.antes .lb{font:800 10.5px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);margin-right:2px}
.antes .a{display:flex;align-items:center;gap:6px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 3px;font:700 12.5px var(--body);color:var(--ink2);white-space:nowrap;height:30px}
.antes .a img{height:22px;aspect-ratio:200/327;border-radius:3px;object-fit:cover}
/* sábana */
.sab{flex:none;display:flex;flex-direction:column;gap:8px;min-width:0;min-height:0}
.app.wide .sab{width:var(--sabw,50%);padding-top:4px}
.app.tall .sab{height:var(--sabh,36%)}
.app.compact .sab{display:none}
.sabhd{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex:none;padding:0 2px}
.sabhd b{font:400 18px var(--disp)}
.sabhd span{font:800 11px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);font-variant-numeric:tabular-nums}
.sbgrid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(var(--cols,9),var(--tw,48px));gap:var(--tg,5px);justify-content:center;align-content:start}
.sb{position:relative;width:var(--tw,48px);aspect-ratio:200/327;border-radius:calc(var(--tw,48px)*.07);overflow:hidden}
.sb.on{background:#fff;box-shadow:0 1px 0 rgba(0,0,0,.08)}
.sb img{width:100%;height:100%;object-fit:cover;display:block;filter:grayscale(1);opacity:var(--dim);transition:opacity .35s,filter .35s}
.sb.on img{filter:none;opacity:1}
.sb .o{position:absolute;right:3%;top:2.5%;min-width:calc(var(--tw,48px)*.36);height:calc(var(--tw,48px)*.36);padding:0 3px;border-radius:999px;background:var(--ink);color:var(--bg);font:800 calc(var(--tw,48px)*.22)/calc(var(--tw,48px)*.36) var(--body);text-align:center;font-variant-numeric:tabular-nums}
.sb.cur{outline:3px solid var(--gold);outline-offset:1px}
.sb.cur .o{background:var(--gold);color:#2B221C}
/* control bar */
.bar{flex:none;display:flex;align-items:center;gap:10px;padding:10px 16px 12px;border-top:1px solid var(--line);background:var(--paper2)}
.cbtn{flex:none;width:46px;height:46px;border-radius:50%;background:var(--paper);border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;color:var(--ink2);padding:0}
.cbtn svg,.nextb svg{width:20px;height:20px;display:block}
.playb{flex:none;position:relative;width:60px;height:60px;border-radius:50%;background:var(--ink);color:var(--bg);border:0;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);padding:0;margin:0 4px}
.playb .ic{width:24px;height:24px;display:block}
.playb .ring{position:absolute;left:-7px;top:-7px;width:74px;height:74px;transform:rotate(-90deg);pointer-events:none}
.ring circle{fill:none;stroke-width:3.5}
.ring .tr{stroke:var(--line)}
.ring .pr{stroke:var(--gold);stroke-linecap:round}
.playb.talk .ring .pr{animation:talk .9s ease-in-out infinite alternate}
@keyframes talk{from{opacity:.25}to{opacity:1}}
.nextb{flex:none;height:46px;border-radius:999px;padding:0 16px 0 18px;background:var(--paper);border:1px solid var(--line2);font:800 14.5px var(--body);display:flex;align-items:center;gap:6px;color:var(--ink)}
.stat{flex:1;min-width:0;font:700 13px var(--body);color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.lotb{flex:none;height:54px;border-radius:14px;border:0;background:var(--red);color:var(--red-ink);font:400 24px/1 var(--disp);padding:0 22px;box-shadow:var(--shadow);letter-spacing:.01em}
.bar .seg{flex:none}
.pacec{flex:none;height:46px;border-radius:999px;padding:0 12px 0 10px;background:var(--paper);border:1px solid var(--line2);font:800 14px var(--body);color:var(--ink);display:none;align-items:center;gap:5px;font-variant-numeric:tabular-nums}
.pacec svg{width:18px;height:18px;display:block;color:var(--ink2)}
/* shared bits */
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:999px;overflow:hidden;background:var(--paper)}
.seg button{background:none;border:0;padding:7px 13px;font:700 13px var(--body);color:var(--ink2)}
.seg button.on{background:var(--ink);color:var(--bg)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.sp{justify-content:space-between;flex-wrap:nowrap}
.btn{background:var(--ink);color:var(--bg);border:1px solid var(--ink);border-radius:10px;padding:9px 14px;font:800 14px var(--body)}
.btn.sec{background:var(--paper);color:var(--ink);border-color:var(--line2)}
.btn.red{background:var(--red);border-color:var(--red);color:var(--red-ink)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.big{padding:12px 22px;font-size:16px;border-radius:12px}
.note{color:var(--ink2);font-size:13.5px;margin:0}
.eyebrow{font:800 11px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stack{display:flex;flex-direction:column;gap:12px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld>span:first-child{font:800 11px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
.fld>.seg,.fld>.stepper{align-self:flex-start}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line2);border-radius:999px;background:var(--paper);overflow:hidden;align-self:flex-start}
.stepper button{background:none;border:0;width:40px;height:40px;font-size:20px;line-height:1;color:var(--ink2)}
.stepper input{border:0;border-radius:0;width:3.4em;text-align:center;padding:6px 0;background:none;font-weight:800;font-variant-numeric:tabular-nums}
/* sheets */
/* --vvh and --vvt: the part of the screen a phone's keyboard leaves, so a sheet and its box sit above the keyboard */
.sheetbg{position:fixed;left:0;right:0;top:var(--vvt,0px);height:var(--vvh,100%);background:rgba(30,20,14,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:min(780px,100%);max-height:calc(100% - 20px - var(--sat));display:flex;flex-direction:column;border-radius:18px 18px 0 0;border-top:3px solid var(--red);padding-bottom:var(--sab)}
.sheet[data-tall]{height:calc(100% - 20px - var(--sat))} /* a sheet of cards to search keeps its height, so the box stays put as matches go */
.sheet:focus{outline:none} /* it takes the focus when it opens, for the keyboard and screen readers */
.sheet .hd{display:flex;gap:8px;align-items:center;padding:14px 16px 8px;flex:none}
.sheet .hd h2{margin:0;font:400 21px/1.1 var(--disp);flex:1}
.sheet .hd.wrap{flex-wrap:wrap}
.sheet .hd.wrap h2{flex:1 0 auto;max-width:100%} /* the checker's title keeps its line, and on a narrow phone its button goes under it */
.sheet .bd{overflow:auto;padding:4px 16px 18px;flex:1;min-height:0;-webkit-overflow-scrolling:touch}
.jd-foot{margin:4px 0 0;text-align:center;color:var(--ink3);font-size:13px}
.jd-foot a{color:var(--ink2);font-weight:400;text-decoration:none}
.jd-foot a:hover,.jd-foot a:focus-visible{text-decoration:underline;text-underline-offset:3px}
.jd-foot a:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
/* patterns */
.pats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.pat{display:flex;gap:10px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:8px 10px;cursor:pointer;text-align:left}
.pat.on{border-color:var(--teal);background:var(--teal-soft)}
.pat .mini{display:grid;grid-template-columns:repeat(4,1fr);gap:1.5px;width:32px;flex:none}
.pat .mini i{display:block;aspect-ratio:1;background:var(--line);border-radius:1px}
.pat .mini i.f{background:var(--teal)}
.pat .mini i.q{background:var(--gold)}
.pat b{display:block;font:400 15px var(--disp)}
.pat small{display:block;font-size:11.5px;color:var(--ink2)}
/* tabla (verify) */
.grid{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:2px;background:var(--line2);border:2px solid var(--line2);border-radius:8px;overflow:hidden;aspect-ratio:2/3.26;max-width:100%}
.cell{position:relative;background:#fff;overflow:hidden}
.cell img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.cell.marked img{filter:brightness(.55) saturate(.7)}
.cell.hit::after,.cell.need::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 3px var(--gold);z-index:5} /* over the card picture */
.cell.need::after{box-shadow:inset 0 0 0 3px var(--red)}
.cell .mk{position:absolute;left:50%;top:50%;z-index:4;width:74%;aspect-ratio:1;transform:translate(-50%,-50%) rotate(var(--rot,0deg));filter:drop-shadow(0 2px 3px rgba(0,0,0,.55))}
.cell .mk svg{width:100%;height:100%;display:block}
.vf{display:grid;grid-template-columns:minmax(0,210px) minmax(0,1fr);gap:18px;align-items:start}
.vfin{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.vfin input#vfJ{width:9.5em;text-transform:uppercase;font-weight:800;letter-spacing:.06em}
.verdict{border-radius:12px;padding:12px 14px;border:1px solid var(--line);background:var(--paper)}
.verdict.ok{background:var(--green-soft);border-color:var(--green)}
.verdict.no{background:var(--red-soft);border-color:var(--red)}
.verdict h3{margin:0;font:400 26px/1.1 var(--disp)}
.verdict.ok h3{color:var(--green)}
.verdict.no h3{color:var(--red)}
.verdict p{margin:5px 0 0;color:var(--ink2)}
.verdict p.vfwarn{color:var(--ink);font-weight:800}
/* the winner row: kept at the bottom of the checker, in front of Card by card's 54 cards. It covers the sheet's own
   18px at the bottom, so at the end the last row of cards scrolls clear of it. */
.vfwin{position:sticky;bottom:-18px;z-index:6;background:var(--bg);margin:0 -16px -18px;padding:4px 16px 18px}
.vfwin::before{content:"";position:absolute;left:0;right:0;bottom:100%;height:12px;background:linear-gradient(transparent,var(--bg));pointer-events:none}
.vfwin .card{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}
.vfwin input{width:100%;min-width:0}
.vfwin .btns{display:flex;gap:8px;flex-wrap:wrap}
.vfwin .chips{grid-column:1/-1;grid-row:2;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -14px;padding:0 14px} /* one line, so the row stays short */
.vfwin .chips::-webkit-scrollbar{display:none}
.vfwin .chips .chip{flex:none}
/* card picker */
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:7px}
.pk{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:4px 4px 5px;text-align:center;cursor:pointer;position:relative;font:inherit;color:inherit}
.pk img{width:100%;aspect-ratio:2/3.26;object-fit:cover;border-radius:5px;display:block;background:#fff}
.pk .n{font:400 12px/1.15 var(--disp);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk .st{position:absolute;top:7px;right:7px;border-radius:999px;min-width:22px;height:22px;padding:0 6px;display:flex;align-items:center;justify-content:center;font:800 11px var(--body);color:var(--on-teal)}
.pk.yes{border-color:var(--green);box-shadow:0 0 0 2px var(--green)}
.pk.yes .st{background:var(--green)}
.pk.no{border-color:var(--red);box-shadow:0 0 0 2px var(--red)}
.pk.no .st{background:var(--red);color:var(--red-ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips .ok{background:var(--green-soft);border-color:var(--green);color:var(--ink)}
.chips .bad{background:var(--red-soft);border-color:var(--red);color:var(--ink)}
/* print */
.prform{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px 18px;align-items:end}
.prgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:14px 12px}
.prt{display:flex;flex-direction:column;gap:4px;min-width:0}
.prt .lb{display:flex;justify-content:space-between;font:800 10.5px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.prt .lb b{color:var(--red);font:400 14px/1 var(--disp);letter-spacing:0}
.prt .g{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;padding:3px;background:#fff;border:1.5px solid #2B221C;border-radius:4px}
.prt .g img{width:100%;aspect-ratio:200/327;object-fit:cover;display:block}
.prdeck .g{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:1px;padding:1px;margin-top:10px}
.prdeck .g img{width:100%;aspect-ratio:400/656;display:block;box-shadow:0 0 0 1px var(--line2)} /* the lines to cut along */
.styles{display:grid;gap:8px;margin-top:8px}
.opt{display:block;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.opt b{display:block;font:400 16px var(--disp)}
.opt small{display:block;color:var(--ink2);font-size:12.5px;margin-top:1px}
.opt.on{border-color:var(--teal);background:var(--teal-soft)}
.rule{margin-top:10px}
.rule+.rule{margin-top:16px}
.rule>b{display:block;font-weight:800}
.rule .styles{margin-top:6px}
.wins{display:flex;flex-direction:column;gap:4px;margin-top:8px;font-size:13.5px}
.wins div{display:flex;gap:8px;color:var(--ink2);font-variant-numeric:tabular-nums}
.wins div b{color:var(--ink);font-weight:800}
.wins.nights div{flex-wrap:wrap;column-gap:10px;row-gap:0}
.wins.nights div span{min-width:7.5em}
/* overlays */
.winbg{position:fixed;left:0;right:0;top:var(--vvt,0px);height:var(--vvh,100%);z-index:60;display:flex;align-items:center;justify-content:center;background:rgba(30,20,14,.55);padding:20px}
.winc{background:var(--paper);border:3px solid var(--gold);border-radius:22px;padding:26px 28px 22px;text-align:center;max-width:420px;width:100%;box-shadow:0 30px 60px -20px rgba(0,0,0,.6);animation:pop .35s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.winc h2{margin:0;font:400 44px/1 var(--disp);color:var(--red)}
.winc p{margin:10px 0 0;color:var(--ink2);font-size:15px}
.winc .row{justify-content:center;margin-top:18px}
.winc .who{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.winc .who input{width:100%;text-align:center}
.winc .chips{justify-content:center}
.winc p.tonight{margin:0;font:800 13.5px var(--body);color:var(--ink);font-variant-numeric:tabular-nums}
.winc p.tonight:empty{display:none}
.winc .who p.tonight{margin-top:-2px}
.winc .chips.co{justify-content:center;align-items:center;margin-top:14px}
.winc .chips.co .eyebrow{margin-right:2px}
.winc .conote{margin-top:10px}
.winc .linkb{display:block;margin:6px auto 0}
.winc .linkb:disabled{opacity:.45}
.winc .askc{display:block;width:64px;aspect-ratio:200/327;object-fit:cover;border-radius:6px;margin:0 auto 12px;box-shadow:var(--shadow)}
.winc.ask h2{font-size:32px;line-height:1.1}
.winc .chips.tied{justify-content:center;margin-top:16px}
.winc .chips.tied .chip{padding:9px 16px;font-size:15px}
.sheet .conote{margin:0;font-weight:800;color:var(--ink)}
.linkb{background:none;border:0;padding:6px;margin-top:10px;color:var(--teal);font:700 13px var(--body);text-decoration:underline;text-underline-offset:3px}
.toast{position:fixed;left:50%;width:max-content;bottom:calc(96px + var(--sab));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;font:700 13px var(--body);opacity:0;transition:.2s;pointer-events:none;z-index:80;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
@media (max-width:700px){.bar .seg{display:none}.pacec{display:inline-flex}.lotb{margin-left:auto}}
@media (max-width:560px){
  .top h1 small{display:none}.top h1{font-size:21px}
  .chip.lb{width:34px;height:34px;padding:0;justify-content:center}.chip.lb span{display:none}.chip.lb svg{width:17px;height:17px}
  .nextb span{display:none}.nextb{padding:0 13px}
  .bar{gap:8px}.lotb{font-size:20px;padding:0 15px;height:50px}
  .vf{grid-template-columns:1fr}.vf .grid{max-width:200px;margin:0 auto}
  .vf>.stack{order:-1} /* the boxes and the verdict above the tabla, so the verdict sits right under the number typed */
  .vfwin .card{grid-template-columns:minmax(0,1fr)}.vfwin .chips{grid-row:auto}
  .cap{min-height:70px}
}
@media (max-width:560px) and (max-height:780px){.vf .grid{max-width:170px}} /* a short phone keeps the verdict and the winner row on screen with the tabla */
@media (max-width:440px){.stat{display:none}.top h1 .t{display:none}}
@media (max-width:400px){.bar{padding:10px 10px 12px;gap:6px}.cbtn{width:42px;height:42px}.nextb{height:42px;padding:0 11px}.pacec{height:42px;padding:0 9px 0 7px;gap:3px}.playb{margin:0 3px}.lotb{font-size:18px;padding:0 11px;height:48px}}
@media (max-width:340px){.pacec svg{display:none}.pacec{padding:0 10px}}
/* On a touchscreen a small button takes a tap 44 px tall, past what it shows (WCAG 2.2 success criterion 2.5.5,
   Target Size), and a little to the sides, short of its neighbours; it looks the same. */
@media (pointer:coarse){
  .chip,.btn.sm,.seg button,.cbtn,.nextb,.pacec,.linkb{position:relative}
  .chip::after,.btn.sm::after,.seg button::after,.cbtn::after,.nextb::after,.pacec::after,.linkb::after{content:"";position:absolute;left:-3px;right:-3px;top:min(0px,calc(50% - 22px));bottom:min(0px,calc(50% - 22px))}
  .seg button::after{left:0;right:0} /* side by side, with no space between */
  .seg{overflow:visible}.seg button:first-child{border-radius:999px 0 0 999px}.seg button:last-child{border-radius:0 999px 999px 0} /* the round ends, without clipping the taps */
}
@media (prefers-reduced-motion:reduce){.picado .fl,.flip .inner.turn,.winc,.playb.talk .ring .pr{animation:none}.toast,.sb img{transition:none}}
.noscript{position:fixed;inset:0;z-index:100;margin:0;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;padding:16px;text-align:center;font:400 22px/1.3 var(--disp);color:var(--ink);background:var(--bg)}
</style>

  // After ¡Buena!: the winner, or the winners on this card as the house rule has them. entry: the one just checked, saved

  // ---------- two ¡Lotería!s on one card ----------

  // The tie-break: each card called since the tie, in order, until one is on a tied tabla. El Cantor decides by itself
  // when it knows every tied tabla (a printed one it checked); otherwise it asks who has the card.
  function holders(n) { return C.tie.who.filter(function (w) { return w.cards && w.cards.indexOf(n) >= 0; }); }
  function tieCheck() {

  // Who has El Gallo? A button for each tied player, those whose tabla El Cantor knows set already.

      var x0 = off + i * (fw + fg), x1 = x0 + fw, y0 = sy(x0), y1 = sy(x1);
      ops.push(col(FLAG[i % 5]) + ' ' + num(x0) + ' ' + Y(y0) + ' m ' + num(x1) + ' ' + Y(y1) + ' l ' + num((x0 + x1) / 2) + ' ' + Y((y0 + y1) / 2 + fh) + ' l h f');
    }
    // heading: the word, the juego, the number
    var ww = wordH * mark.w / mark.h;
    ops.push('q ' + num(ww) + ' 0 0 ' + num(wordH) + ' ' + num(gx) + ' ' + Y(headTop + wordH) + ' cm /' + mark.name + ' Do Q'); used.push(mark);
    text('HB', 7.6 * s, gx + 1 * s, labelBase, 'JUEGO ' + name, GREY, 1.5 * s);
    var base = headTop + wordH * mark.base, ns = String(k), nsz = 38 * s, nw = textW('TB', nsz, ns);
    text('TB', nsz, gx + gw - nw, base, ns, RED);
    var lab = 'No.', lsz = 10 * s;
    text('HB', lsz, gx + gw - nw - textW('HB', lsz, lab, 0.6 * s) - 4 * s, base, lab, GREY, 0.6 * s);

    ops.push(num(0.5 * s) + ' w ' + rrect(gx + 3 * s, gy + 3 * s, gw - 6 * s, gh - 6 * s, 3.5 * s) + ' S');
    t.forEach(function (n, j) {
      var im = pdf.image('c' + n, imgs[n]), x = gx + pad + (j % 4) * (cw + gap), y = gy + pad + Math.floor(j / 4) * (ch + gap);
      ops.push('q ' + num(cw) + ' 0 0 ' + num(ch) + ' ' + num(x) + ' ' + Y(y + ch) + ' cm /' + im.name + ' Do Q'); used.push(im);
      ops.push(num(0.6 * s) + ' w ' + num(x) + ' ' + Y(y + ch) + ' ' + num(cw) + ' ' + num(ch) + ' re S');
    });
    var foot = T('pdf.footer', { name: name, k: k }), fsz = 7 * s; // in the language chosen (it fits, in Spanish too, on every layout)

  }
  function fontsReady() {
    if (!document.fonts || !document.fonts.load) return Promise.resolve();
    return Promise.race([document.fonts.load('400 160px "Bree Serif"'), new Promise(function (r) { setTimeout(r, 2500); })]).catch(function () { });
  }
  function dataBytes(url) { var b = atob(url.split(',')[1]), o = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) o[i] = b.charCodeAt(i); return o; }
  function wordmark() {
    return fontsReady().then(function () {
      var px = 160, font = '400 ' + px + 'px "Bree Serif", Georgia, serif', cv = document.createElement('canvas'), g = cv.getContext('2d');
      g.font = font; var w = Math.ceil(g.measureText('Lotería').width + px * 0.08), h = Math.ceil(px * 1.2), base = Math.round(px * 0.93);
      cv.width = w; cv.height = h; g = cv.getContext('2d');
      g.fillStyle = '#ffffff'; g.fillRect(0, 0, w, h); g.font = font; g.fillStyle = '#B7332F'; g.textBaseline = 'alphabetic'; g.fillText('Lotería', px * 0.02, base);
      return { bytes: dataBytes(cv.toDataURL('image/jpeg', 0.95)), base: base / h };
    });
  }
  function cardBytes(n) {
    function viaCanvas() {
      return new Promise(function (ok, bad) {
        var im = new Image();
        im.onload = function () { try { var cv = document.createElement('canvas'); cv.width = im.naturalWidth; cv.height = im.naturalHeight; cv.getContext('2d').drawImage(im, 0, 0); ok(dataBytes(cv.toDataURL('image/jpeg', 0.92))); } catch (e) { bad(new Error(T('cantor.prFileUrl'))); } };
        im.onerror = function () { bad(new Error(T('cantor.prImgLoad'))); };
        im.src = src(n);
      });
    }
    if (!window.fetch) return viaCanvas();
    return fetch(src(n)).then(function (r) { if (!r.ok) throw 0; return r.arrayBuffer(); }).then(function (b) { var u = new Uint8Array(b); if (!jpegInfo(u)) throw 0; return u; }).catch(viaCanvas);
  }
  function makePdf(name, count, per, paper) {
    var tablas = L.juego(name, count), need = {};
    tablas.forEach(function (t) { t.forEach(function (n) { need[n] = 1; }); });
    var ns = Object.keys(need).map(Number);
    return Promise.all([wordmark()].concat(ns.map(cardBytes))).then(function (res) {
      var wm = res[0], imgs = {}; ns.forEach(function (n, i) { imgs[n] = res[i + 1]; });
      var P = paper === 'a4' ? [595.28, 841.89] : [612, 792], W = per === 2 ? P[1] : P[0], H = per === 2 ? P[0] : P[1], m = 36;
      var pdf = new Pdf(W, H), mark = pdf.image('wordmark', wm.bytes); mark.base = wm.base;
      for (var i = 0; i < tablas.length; i += per) {
        var ops = [], used = [];
        for (var j = 0; j < per && i + j < tablas.length; j++) {
          var box = per === 2 ? { x: j ? W / 2 + m : m, y: m, w: (W - 4 * m) / 2, h: H - 2 * m } : { x: m, y: m, w: W - 2 * m, h: H - 2 * m };
          drawTabla(pdf, ops, used, box, tablas[i + j], name, i + j + 1, imgs, mark);
        }
        // The cut line, only between two tablas: a lone one (the last of an odd count) has nothing to cut it from.
        if (per === 2 && i + 1 < tablas.length) ops.push(col(RULE, true) + ' 0.5 w [4 3] 0 d ' + num(W / 2) + ' ' + num(m / 2) + ' m ' + num(W / 2) + ' ' + num(H - m / 2) + ' l S [] 0 d');

  }
  // The deck to cut out: the 54 cards in order, 9 to a page, edge to edge at 2 in wide (each about 2 × 3.3 in, the
  // cards' own shape), with light lines along every edge that run a little into the margin, to cut along.
  var DECK_PAGES = Math.ceil(54 / 9);
  function makeDeck(paper) {
    var ns = CARDS.map(function (c) { return c.n; });
    return Promise.all(ns.map(cardBytes)).then(function (imgs) {
      var P = paper === 'a4' ? [595.28, 841.89] : [612, 792], W = P[0], H = P[1], cw = 144, ch = cw * 656 / 400;
      var gx = (W - 3 * cw) / 2, gy = (H - 3 * ch) / 2 - 6, pdf = new Pdf(W, H), over = 14;
      for (var pg = 0; pg < DECK_PAGES; pg++) {
        var ops = [], used = [], on = ns.slice(pg * 9, pg * 9 + 9), rows = Math.ceil(on.length / 3);
        on.forEach(function (n, j) {
          var im = pdf.image('c' + n, imgs[ns.indexOf(n)]), x = gx + (j % 3) * cw, y = gy + Math.floor(j / 3) * ch;
          ops.push('q ' + num(cw) + ' 0 0 ' + num(ch) + ' ' + num(x) + ' ' + num(H - y - ch) + ' cm /' + im.name + ' Do Q'); used.push(im);
        });
        var cut = [];
        for (var k = 0; k <= 3; k++) cut.push(num(gx + k * cw) + ' ' + num(H - gy + over) + ' m ' + num(gx + k * cw) + ' ' + num(H - gy - rows * ch - over) + ' l');
        for (k = 0; k <= rows; k++) cut.push(num(gx - over) + ' ' + num(H - gy - k * ch) + ' m ' + num(gx + 3 * cw + over) + ' ' + num(H - gy - k * ch) + ' l');
        ops.push(col(RULE, true) + ' 0.5 w ' + cut.join(' ') + ' S');
        var foot = T('pdf.deckFooter', { k: pg + 1, n: DECK_PAGES }), fsz = 7;
        ops.push('BT /F2 ' + fsz + ' Tf 0 Tc ' + col(GREY) + ' ' + num((W - textW('H', fsz, foot)) / 2) + ' ' + num(H - gy - rows * ch - over - 12) + ' Td (' + pdfStr(foot) + ') Tj ET');
        pdf.page(ops, used);
      }
      return pdf.bytes('Lotería · ' + T('cantor.prDeck'));
    });
  }

  // ---------- Google Drive ----------
  if (window.LoteriaSync) LoteriaSync.onNote(function (m) { toast(m, 6000); }); // what went wrong after a tap on Sync now, long enough to read
  // El Cantor has no ☁ button: a winner or a juego saved after Google's hour says it waits here for Sync now.
  if (window.LoteriaSync) LoteriaSync.onWait(function () { toast(T('cantor.syncWait'), 6000); });
  if (window.LoteriaSync) LoteriaSync.onUpdate(function (keys) { // winners, the juego and what was printed, from another device
    if (keys.indexOf(LS) < 0) return;
    try { var o = JSON.parse(localStorage.getItem(LS)); if (o) { if (Array.isArray(o.wins)) C.wins = goodWins(o.wins); if (typeof o.juego === 'string') C.juego = o.juego; C.printed = goodPrinted(o.printed); } } catch (e) { }
  });

  // ---------- another El Cantor window on this device ----------
  // The installed app and a browser tab, or two tabs, share one save. When the other one turns a card or shuffles,
  // this one stops calling and follows it, so no card is called twice and neither puts the other's round back.
  function follow(raw) {
    var o; try { o = JSON.parse(raw); } catch (x) { return; }
    if (!wholeDeck(o)) return;
    var was = C.round + ':' + C.pos + ':' + C.order.join(), busy = R.playing || R.phase !== 'idle' || R.opening;
    take(o);
    if (C.round + ':' + C.pos + ':' + C.order.join() !== was) {
      pause(); hush(); R.phase = 'idle'; R.opening = false;
      showCard(false, true);
      if (busy) toast(T('cantor.otherWindow'));
    }
    renderTie(); renderCaption(); renderAll();
  }
  window.addEventListener('storage', function (e) { if (e.key === LS && e.newValue) follow(e.newValue); });
  window.addEventListener('pageshow', function (e) { if (e.persisted) try { follow(localStorage.getItem(LS)); } catch (x) { } }); // back from the browser's history, which missed the saves made meanwhile

  // ---------- wiring ----------
  function playPause() { if (C.pos >= 54) newRoundAsk(); else if (R.playing) pause(); else play(); }
  // Tapping the card pauses and resumes, like the play button; Next card turns one by hand.
  $('flip').addEventListener('click', function () { var was = R.playing; playPause(); if (was && !R.playing) toast(T('cantor.tapToKeep')); });
  $('playBtn').addEventListener('click', playPause);
  $('paceChip').addEventListener('click', function () {
    var order = ['slow', 'normal', 'fast'], v = order[(order.indexOf(C.settings.pace) + 1) % 3];
    setPace(v); toast(T('cantor.paceToast', { pace: paceName(v), s: PACE[v] / 1000 }));
  });
  $('nextBtn').addEventListener('click', next);
  $('backBtn').addEventListener('click', back);
  $('lotBtn').addEventListener('click', shout);
  $('patBtn').addEventListener('click', function () { patternSheet(); });
  $('sabBtn').addEventListener('click', sabanaSheet);
  $('printBtn').addEventListener('click', printSheet);
  $('newBtn').addEventListener('click', newRoundAsk);
  $('setBtn').addEventListener('click', settingsSheet);
  document.querySelectorAll('#paceBar button').forEach(function (b) { b.addEventListener('click', function () { setPace(b.dataset.v); }); });
  document.addEventListener('keydown', function (e) {
    // Escape closes a sheet; on a ¡Lotería! box it goes the way Keep calling does, and leaves up a box whose winners aren't saved yet.
    if (e.key === 'Escape') { var wb = $('winbox'); if (!$('sheet').hidden) closeSheet(); else if (!wb.hidden) { if (wb.dataset.esc === 'back') $('clBack').click(); else if (wb.dataset.esc !== 'stay') wb.hidden = true; } return; }
    var tag = (e.target && e.target.tagName) || '';
    if (!$('sheet').hidden || !$('winbox').hidden || /INPUT|SELECT|TEXTAREA/.test(tag) || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === ' ' && tag !== 'BUTTON') { e.preventDefault(); $('playBtn').click(); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); if (!R.opening) next(); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); back(); }
    else if (e.key === 'l' || e.key === 'L') { e.preventDefault(); shout(); }
    else if (e.key === 'r' || e.key === 'R') { e.preventDefault(); again(); }
    else if ((e.key === 'f' || e.key === 'F') && fsOk()) { e.preventDefault(); fullScreen(!fsOn()); }
  });
  var rT; function relayout() { clearTimeout(rT); rT = setTimeout(function () { picado(); layout(); }, 60); }
  window.addEventListener('resize', relayout);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', relayout);
  // A phone's keyboard covers the bottom of the screen without making the page any shorter (an iPhone's, and Chrome's
  // on Android): --vvh and --vvt are the part it leaves, for the sheets and the ¡Lotería! box. Not while zoomed in.
  function keyboardFit(e) {

    // The box being typed in stays in view in its sheet as the keyboard comes up.
    var a = document.activeElement, bd = e && e.type === 'resize' && a && a.tagName === 'INPUT' && a.closest('.bd');
    if (bd) { var r = a.getBoundingClientRect(), b = bd.getBoundingClientRect(); if (r.bottom > b.bottom - 8) bd.scrollTop += r.bottom - b.bottom + 8; else if (r.top < b.top + 8) bd.scrollTop -= b.top - r.top + 8; }

  fromHash(); window.addEventListener('hashchange', fromHash);

  if (document.fonts && document.fonts.ready) document.fonts.ready.then(layout);
})();
